[project]
name = "yongjie-panel-api"
version = "0.1.0"
description = "Atomic-card server dashboard API with per-card agents and AI gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.43",
  "pydantic>=2.12",
  "pydantic-settings>=2.5",
  "alembic>=1.13",
  "httpx>=0.27",
  "docker>=7.1",
  "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
