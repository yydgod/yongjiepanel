# dsh 原生工作区（独立子域名，推荐）
# 浏览器通过 https://dsh.example.com 加载 dsh；面板只负责给出带 token 的地址。
server {
    listen 443 ssl http2;
    server_name dsh.example.com;

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;

    # token 在查询串里，避免访问日志记录完整 URL
    access_log off;

    # 只允许面板域名 iframe 嵌入；按实际面板域名修改
    add_header Content-Security-Policy "frame-ancestors 'self' https://panel.example.com" always;

    location / {
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # dsh 的 RPC/流式输出，关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name dsh.example.com;
    return 301 https://$host$request_uri;
}
