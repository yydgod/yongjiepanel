# 永杰面板 nginx 站点配置示例
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/yongjie-panel.conf
#   sudo vi /etc/nginx/conf.d/yongjie-panel.conf   # 改 server_name / 证书路径
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name panel.example.com;

    # 未配置 HTTPS 时可注释掉下一行，直接使用 80 端口
    return 301 https://$host$request_uri;

    # ---------- 无 HTTPS 时的写法（二选一）----------
    # root /var/www/yongjie-panel;
    # index index.html;
    # include /etc/nginx/snippets/yongjie-panel-locations.conf;
}

# 自签或已有证书时，把下面整段改为 listen 80; 并去掉 ssl 相关行
server {
    listen 443 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/yongjie-panel;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Agent 对话使用 SSE，必须关闭缓冲，否则不会逐字输出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 如启用 ADMIN_TOKEN，前端会带 Authorization，无需在此额外处理
        # proxy_set_header Authorization $http_authorization;
    }

    # ---------- 静态资源 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- SPA history 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/yongjie-panel.access.log;
    error_log  /var/log/nginx/yongjie-panel.error.log warn;
}
